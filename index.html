<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket History by Yash - आज का क्रिकेट इतिहास</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #1e293b;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.4rem;
        }
        header p {
            font-size: 0.95rem;
            color: #cbd5e1;
        }
        .container {
            max-width: 800px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }
        .date-box {
            background: white;
            padding: 1rem;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .current-date {
            font-size: 1.1rem;
            font-weight: bold;
            color: #1e3a8a;
        }
        input[type="date"] {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 5px solid #2563eb;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .year-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .event-text {
            font-size: 1rem;
            color: #334155;
        }
        .read-more {
            display: inline-block;
            margin-top: 8px;
            color: #2563eb;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .loader {
            text-align: center;
            padding: 2rem;
            font-size: 1.1rem;
            color: #475569;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

<header>
    <h1>🏏 Cricket History by Yash</h1>
    <p>हर रोज़ जानें आज के दिन का ऐतिहासिक क्रिकेट सफ़र</p>
</header>

<div class="container">
    <div class="date-box">
        <div class="current-date" id="displayDate">आज का इतिहास</div>
        <div>
            <label for="datePicker" style="font-size: 0.9rem; color: #475569;">तारीख बदलें: </label>
            <input type="date" id="datePicker">
        </div>
    </div>

    <div id="eventsContainer">
        <div class="loader">क्रिकेट इतिहास लोड हो रहा है... कृपया प्रतीक्षा करें ⏳</div>
    </div>
</div>

<footer>
    © 2026 Cricket History by Yash | ऑटोमैटिक डेली अपडेट
</footer>

<script>
    const eventsContainer = document.getElementById('eventsContainer');
    const displayDate = document.getElementById('displayDate');
    const datePicker = document.getElementById('datePicker');

    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    // आज की तारीख सेट करें
    const today = new Date();
    datePicker.valueAsDate = today;

    function fetchCricketHistory(dateObj) {
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        const monthName = months[dateObj.getMonth()];

        displayDate.innerText = `📅 ${dateObj.getDate()} ${monthName} का क्रिकेट इतिहास`;
        eventsContainer.innerHTML = '<div class="loader">इतिहास खोजा जा रहा है... ⏳</div>';

        // Wikipedia On This Day API से डेटा लाना
        const url = `https://wikipedia.org{month}/${day}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                let allEvents = [];
                if (data.events) allEvents = allEvents.concat(data.events);
                if (data.births) allEvents = allEvents.concat(data.births.map(b => ({...b, isBirth: true})));

                // केवल क्रिकेट से जुड़ी घटनाएं फ़िल्टर करना
                const cricketKeywords = ['cricket', 'cricketer', 'test match', 'odi', 'world cup', 'ashes', 'wicket', 'century', 'batsman', 'bowler', 'icc', 'ipl'];
                
                const cricketEvents = allEvents.filter(item => {
                    const textLower = item.text.toLowerCase();
                    return cricketKeywords.some(keyword => textLower.includes(keyword));
                });

                renderEvents(cricketEvents, `${dateObj.getDate()} ${monthName}`);
            })
            .catch(error => {
                eventsContainer.innerHTML = '<div class="card">डेटा लोड करने में समस्या आई। कृपया इंटरनेट कनेक्शन जांचें और पेज रिफ्रेश करें।</div>';
            });
    }

    function renderEvents(events, dateStr) {
        if (events.length === 0) {
            eventsContainer.innerHTML = `
                <div class="card">
                    <span class="year-badge">विशेष जानकारी</span>
                    <p class="event-text">${dateStr} को कोई बड़ी अंतरराष्ट्रीय क्रिकेट घटना दर्ज नहीं मिली। आप ऊपर दिए गए कैलेंडर से किसी और तारीख का इतिहास देख सकते हैं!</p>
                </div>`;
            return;
        }

        // साल के हिसाब से नए से पुराने क्रम में लगाएं
        events.sort((a, b) => b.year - a.year);

        let html = '';
        events.forEach(event => {
            const badgeText = event.isBirth ? `🎂 जन्म - ${event.year}` : `🏆 घटना - ${event.year}`;
            const pageLink = event.pages && event.pages[0] ? event.pages[0].content_urls.mobile.page : '#';
            
            html += `
                <div class="card">
                    <span class="year-badge">${badgeText}</span>
                    <p class="event-text">${event.text}</p>
                    ${pageLink !== '#' ? `<a href="${pageLink}" target="_blank" class="read-more">पूरी जानकारी पढ़ें →</a>` : ''}
                </div>
            `;
        });

        eventsContainer.innerHTML = html;
    }

    // तारीख बदलने पर नया डेटा लोड करें
    datePicker.addEventListener('change', (e) => {
        if (e.target.value) {
            const selectedDate = new Date(e.target.value);
            fetchCricketHistory(selectedDate);
        }
    });

    // पेज खुलते ही आज का इतिहास दिखाएं
    fetchCricketHistory(today);
</script>

</body>
</html>
